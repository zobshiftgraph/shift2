  }

  // ── Render ──
  function formatDateLabel(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  // Label for hour slot [h, h+1) on the extended timeline (4..26)
  function axisHourLabel(h) {
    const clock = h >= 24 ? h - 24 : h;
    return String(clock).padStart(2, '0') + '00';
  }

  function renderTimeline(shiftsForDate) {
    const span = VIEW_END - VIEW_START;
    const hours = [];
    for (let h = VIEW_START; h <= VIEW_END; h++) hours.push(h);

    // Current time position — only show if viewing today's date
    const activeDate = getActiveDate();
    const todayStr = localDateStr();
    let nowPct = -1;
    if (activeDate === todayStr) {
      const now = new Date();
      const nowH = now.getHours() + now.getMinutes() / 60;
      // Handle the 4am–2am window: times before 4am are past midnight so add 24
      const nowInTimeline = nowH < VIEW_START ? nowH + 24 : nowH;
      nowPct = ((nowInTimeline - VIEW_START) / span) * 100;
      if (nowPct < 0 || nowPct > 100) nowPct = -1;
    }

    // Apply all previewed shift changes to bar display (keeps row position)
    const displayPreviewReqs = Array.from(previewReqIds)
      .map(pid => (requestsByDate[getActiveDate()] || []).find(r => String(r.id) === pid))
      .filter(Boolean);

    const displayShifts = shiftsForDate.map(s => {
      const pr = displayPreviewReqs.find(r =>
        isShiftChangeType(r.type) && r.to && shiftMatchesChangeRequest(s, r)
      );
      if (pr) return applyShiftChangePreview(s, pr);
      return s;
    });

    const byEmployee = buildByEmployee(displayShifts);

    let html = `<div class="timeline-container">`;

    // ── Time label row ──
    html += `<div class="chart-axis" style="height:22px;margin-bottom:2px;">`;
    html += `<div class="chart-axis-spacer"></div><div class="chart-axis-track">`;
    // Labels aligned on vertical grid lines (same positions as bar-track hour lines)
    for (let h = VIEW_START + 1; h <= VIEW_END; h++) {
      const pct = ((h - VIEW_START) / span) * 100;
      const label = axisHourLabel(h);
      const isNextDay = h >= 24;
      html += `<span class="time-label" style="left:${pct}%;${isNextDay ? 'color:var(--accent3);' : ''}">${label}</span>`;
    }
    // Current time indicator on axis
    if (nowPct >= 0) {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      html += `<div style="
        position:absolute;
        left:${nowPct}%;
        top:0;bottom:0;
        display:flex;align-items:center;
        transform:translateX(-50%);
        pointer-events:none;z-index:5;
      ">
        <span style="
          background:var(--accent2);color:#fff;
          font-family:var(--font-mono);font-size:9px;font-weight:700;
          padding:1px 4px;border-radius:3px;white-space:nowrap;
          box-shadow:0 1px 4px rgba(0,0,0,0.2);
        ">${timeStr}</span>
      </div>`;
    }
    html += `</div></div>`;

    const date = getActiveDate();
    const allReqs = requestsByDate[date] || [];
    const previewReqs = Array.from(previewReqIds)
      .map(pid => allReqs.find(r => String(r.id) === pid))
      .filter(Boolean);

    // ── Hourly staffing counts (reflect previewed requests) ──
    const { hourCounts } = buildHourlyCountContext(date, displayShifts, previewReqs);

    const dow = new Date(date + 'T12:00:00').getDay();
    const isWeekday = dow >= 1 && dow <= 5;
    const minStaff = isWeekday ? { 6:4, 7:6, 20:8, 21:5, 22:3 } : {};

    html += `<div class="chart-axis" style="height:22px;margin-bottom:4px;">`;
    html += `<div class="chart-axis-spacer"></div><div class="chart-axis-track">`;
    hourCounts.forEach(({ h, count, names, leaveOff }) => {
      const h24 = h % 24;

      const leftPct  = ((h - VIEW_START) / span) * 100;
      const widthPct = (1 / span) * 100;

      const isDayWindow = h >= 7 && h < 20; // 0700–2000 hour slots
      const slotLabel = formatHourSlot(h);
      const leaveNote = leaveOff.length ? ` −leave ${leaveOff.join(', ')}` : '';
      const tip = `${slotLabel}: ${count}\n${names.join(', ')}${leaveNote}`;

      let bgColor, textColor;
      if (isDayWindow && count < 6) {
        bgColor = 'rgba(217,79,110,0.4)'; textColor = '#9b1a34';
      } else if (isDayWindow && count < 7) {
        bgColor = 'rgba(253,200,60,0.55)'; textColor = '#7a5a00';
      } else if (count === 0) {
        bgColor = 'transparent'; textColor = 'transparent';
      } else if (minStaff[h24] !== undefined && count < minStaff[h24]) {
        bgColor = 'rgba(217,79,110,0.35)'; textColor = '#9b1a34';
      } else {
        const intensity = Math.min(0.15 + (count / Math.max(displayShifts.length, 1)) * 0.5, 0.65);
        bgColor = `rgba(91,155,213,${intensity})`;
        textColor = '#1a4a7a';
      }

      const showCount = count > 0 || bgColor !== 'transparent';

      html += `<div style="
        position:absolute;
        left:${leftPct}%;
        width:${widthPct}%;
        top:0;height:100%;
        background:${bgColor};
        border-radius:3px;
        display:flex;align-items:center;justify-content:center;
        cursor:help;
      " title="${tip.replace(/"/g, '&quot;')}">
        ${showCount ? `<span class="hour-count" style="color:${textColor};">${count}</span>` : ''}
      </div>`;
    });
    html += `</div></div>`;
    html += `<div class="grid-and-bars"><div class="chart-track">`;

    // Single full-height current time line over the entire chart
    if (nowPct >= 0) {
      html += `<div style="
        position:absolute;
        top:0;bottom:0;
        left:${nowPct}%;
        width:2px;
        background:#d94f6e;
        pointer-events:none;
        z-index:50;
        transform:translateX(-1px);
      "></div>`;
    }

    const sortDate = getActiveDate();
    const defaultOrder = sortEmployeeRowEntries(byEmployee, sortDate, true);

    // Apply custom row order if set, preserving any new rows at the end
    const savedOrder = rowOrderByDate[sortDate];
    let sortedEmployees;
    if (savedOrder && savedOrder.length) {
      const empMap = Object.fromEntries(defaultOrder);
      const ordered = savedOrder.filter(k => empMap[k]).map(k => [k, empMap[k]]);
      const newRows = defaultOrder.filter(([k]) => !savedOrder.includes(k));
      sortedEmployees = [...ordered, ...newRows];
      const dayRows   = sortedEmployees.filter(([, shifts]) => shifts.every(s => (s._origStart ?? opsStartOf(s)) < 20));
      const nightRows = sortedEmployees.filter(([, shifts]) => shifts.some(s  => (s._origStart ?? opsStartOf(s)) >= 20));
      sortedEmployees = [...dayRows, ...nightRows];
    } else {
      sortedEmployees = defaultOrder;
      rowOrderByDate[sortDate] = defaultOrder.map(([k]) => k);
    }

    sortedEmployees.forEach(([rowKey, empShifts]) => {
      const name = rowKey.replace(/\u200B/g, '');
      html += `<div class="employee-row" draggable="true"
        data-rowkey="${rowKey}"
        ondragstart="rowDragStart(event,'${rowKey}')"
        ondragover="rowDragOver(event)"
        ondragleave="rowDragLeave(event)"
        ondrop="rowDrop(event,'${rowKey}')"
        ondragend="rowDragEnd(event)">`;
      html += `<div class="emp-label" style="cursor:grab;">
        <span class="emp-name" title="${name}">${name}</span>
      </div><div class="bar-track">`;

      // Hour grid lines — rendered inside bar-track, track spans VIEW_START→VIEW_END
      hours.forEach(h => {
        if (h === VIEW_START) return;
        const pct = ((h - VIEW_START) / span) * 100;
        const isMidnight = (h % 24 === 0);
        html += `<div style="position:absolute;top:0;bottom:0;left:${pct}%;width:1px;background:${isMidnight ? 'rgba(26,171,155,0.35)' : 'rgba(0,0,0,0.1)'};pointer-events:none;z-index:0;"></div>`;
      });

      empShifts.forEach(shift => {
        const bar = shiftBarSpan(shift, date);
        const vis = visibleSpan(bar);
        if (!vis) return;
        const visStart = vis.start;
        const visEnd = vis.end;
        const left = ((visStart - VIEW_START) / span) * 100;
        const width = ((visEnd - visStart) / span) * 100;
        const col = getColor(shift);
        const duration = shift.end - shift.start;
        const label = `${formatTime(shift.start % 24)}–${formatTime(shift.end % 24)}`;

        // Check if a whole-shift leave is being previewed for this person
        const wholeLeavePreview = Array.from(previewReqIds).some(pid => {
          const r = (requestsByDate[date] || []).find(x => String(x.id) === pid);
          return r && r.cpc === name && r.isLeave && !r.isPartial && !isTOSType(r.type);
        });
        const barBg = wholeLeavePreview ? 'rgba(130,130,145,0.6)' : col.bg;
        const core = toTimeline(opsStartOf(shift), opsEndOf(shift));

        // Green TOS overlays — portions outside the core shift (stored + previewed)
        let tosOverlays = '';
        allTOSList(shift, date).forEach(tos => {
          const tSpan = toTimeline(tos.tosStart, tos.tosEnd);
          if (tSpan.start < core.start) {
            const tVis = visibleSpan({ start: tSpan.start, end: core.start });
            if (!tVis) return;
            const tLeft  = ((tVis.start - visStart) / (visEnd - visStart)) * 100;
            const tWidth = ((tVis.end - tVis.start) / (visEnd - visStart)) * 100;
            const previewStyle = tos.preview ? 'opacity:0.75;border:1px dashed rgba(255,255,255,0.8);' : '';
            tosOverlays += `<div style="position:absolute;left:${tLeft}%;width:${tWidth}%;top:0;bottom:0;background:#22a06b;border-radius:5px 0 0 5px;pointer-events:none;z-index:1;${previewStyle}"></div>`;
          }
          if (tSpan.end > core.end) {
            const tVis = visibleSpan({ start: core.end, end: tSpan.end });
            if (!tVis) return;
            const tLeft  = ((tVis.start - visStart) / (visEnd - visStart)) * 100;
            const tWidth = ((tVis.end - tVis.start) / (visEnd - visStart)) * 100;
            const previewStyle = tos.preview ? 'opacity:0.75;border:1px dashed rgba(255,255,255,0.8);' : '';
            tosOverlays += `<div style="position:absolute;left:${tLeft}%;width:${tWidth}%;top:0;bottom:0;background:#22a06b;border-radius:0 5px 5px 0;pointer-events:none;z-index:1;${previewStyle}"></div>`;
          }
        });

        // Yellow last-hour overlay: shifts ending at or before 21:00, not dev (trainee) or CIC
        // Skip if there is approved leave covering the last hour of the shift
        let yellowInner = '';
        if (!shift.dev && !shift.cic && shift.end <= 21 && shift.end > shift.start) {
          const hasLeaveAtEnd = (requestsByDate[date] || []).some(r =>
            r.cpc === name && r.lvEnd != null && r.lvStart != null &&
            (r.status === 'approved-partial' || r.resolvedAction === 'approve') &&
            r.isPartial && r.lvEnd >= shift.end - 0.01
          );
          if (!hasLeaveAtEnd) {
            const barDuration = visEnd - visStart;
            const yellowDuration = Math.min(1, barDuration);
            const yellowPct = (yellowDuration / barDuration) * 100;
            yellowInner = `<div style="
              position:absolute;right:0;top:0;bottom:0;
              width:${yellowPct}%;
              background:rgba(253,200,60,0.45);
              border-radius:0 5px 5px 0;
              pointer-events:none;
            "></div>`;
          }
        }

        // Grey LV overlay — approved-partial from import, manually approved partial leave, or previewed
        const partialLeaves = (requestsByDate[date] || []).filter(r => {
          if (isShiftChangeType(r.type) || isTOSType(r.type) || !r.isPartial || r.cpc !== name) return false;
          const isApproved = r.status === 'approved-partial' || (r.resolvedAction === 'approve' && r.isPartial);
          const isPreviewed = previewReqIds.has(String(r.id));
          if (!isApproved && !isPreviewed) return false;
          // Ensure lvStart/lvEnd are populated (may need to parse from from/to)
          if (r.lvStart == null) r.lvStart = parseTimeStr(r.from);
          if (r.lvEnd   == null) r.lvEnd   = parseTimeStr(r.to);
          return r.lvStart != null && r.lvEnd != null;
        });
        let lvOverlays = '';
        partialLeaves.forEach(lv => {
          const lvVisStart = Math.max(lv.lvStart, visStart);
          const lvVisEnd   = Math.min(lv.lvEnd,   visEnd);
          if (lvVisEnd <= lvVisStart) return;
          const lvLeft  = ((lvVisStart - visStart) / (visEnd - visStart)) * 100;
          const lvWidth = ((lvVisEnd - lvVisStart) / (visEnd - visStart)) * 100;
          const lvLabel = `LV ${formatTime(lv.lvStart)}–${formatTime(lv.lvEnd)}`;
          // Only show label text if it fits on the grey overlay within the bar
          const showLvLabel = lvWidth >= Math.max(12, lvLabel.length * 0.55);

          lvOverlays += `<div style="
            position:absolute;left:${lvLeft}%;width:${lvWidth}%;top:0;bottom:0;
            background:rgba(160,160,170,0.72);
            ${showLvLabel ? 'display:flex;align-items:center;justify-content:center;' : ''}
            font-family:var(--font-display);font-size:11px;font-weight:700;
            color:#333;letter-spacing:0.1px;
            pointer-events:none;z-index:3;
            overflow:hidden;
          ">${showLvLabel ? lvLabel : ''}</div>`;
        });

        const durLabel = `(${formatDuration(duration)})`;

        // Determine if leave covers the start or end of the shift
        const leaveAtStart = partialLeaves.some(lv => lv.lvStart <= shift.start + 0.05);
        const leaveAtEnd   = partialLeaves.some(lv => lv.lvEnd   >= shift.end   - 0.05);

        // Gap hours: look across prev/current/next day schedules for this employee
        const activeDate = getActiveDate();
        const activeDateObj = new Date(activeDate + 'T12:00:00');

        const prevDateObj = new Date(activeDateObj); prevDateObj.setDate(prevDateObj.getDate() - 1);
        const nextDateObj = new Date(activeDateObj); nextDateObj.setDate(nextDateObj.getDate() + 1);
        const prevDateStr = prevDateObj.toISOString().slice(0, 10);
        const nextDateStr = nextDateObj.toISOString().slice(0, 10);

        // Collect all shifts for this employee across prev/current/next day
        // Offset times: prev day shifts subtract 24h, next day shifts add 24h
        const allEmpShifts = [];
        [[prevDateStr, -24], [activeDate, 0], [nextDateStr, 24]].forEach(([d, offset]) => {
          (schedulesByDate[d] || []).filter(s => s.name === name).forEach(s => {
            allEmpShifts.push({ ...s, start: s.start + offset, end: s.end + offset });
          });
        });
        allEmpShifts.sort((a, b) => a.start - b.start);

        // Find this specific shift in the merged list by matching offset-adjusted times
        const thisStart = shift.start;
        const thisEnd = shift.end;
        const thisIdx = allEmpShifts.findIndex(s =>
          Math.abs(s.start - thisStart) < 0.01 && Math.abs(s.end - thisEnd) < 0.01 && s.id === shift.id
        );

        const prevS = thisIdx > 0 ? allEmpShifts[thisIdx - 1] : null;
        const nextS = thisIdx < allEmpShifts.length - 1 ? allEmpShifts[thisIdx + 1] : null;

        const gapBefore = prevS ? shift.start - prevS.end : null;
        const gapAfter  = nextS ? nextS.start - shift.end : null;

        const gapBeforeStyle = (gapBefore !== null && gapBefore < 10) ? 'font-weight:600;color:#ffb3c6;' : 'opacity:0.95;font-weight:500;';
        const gapAfterStyle  = (gapAfter  !== null && gapAfter  < 10) ? 'font-weight:600;color:#ffb3c6;' : 'opacity:0.95;font-weight:500;';

        const gapBeforeStr = (gapBefore !== null && gapBefore > 0) ? `◀ ${formatDuration(gapBefore)}` : null;
        const gapAfterStr  = (gapAfter  !== null && gapAfter  > 0) ? `${formatDuration(gapAfter)} ▶` : null;

        // Calculate the blue (non-overlay) region for centering text
        // Yellow is on the right (last hour), LV grey can be at start or end
        let blueLeft = 0;   // % from bar left
        let blueRight = 0;  // % from bar right (i.e. blueWidth = 100 - blueLeft - blueRight)

        // Yellow overlay occupies the rightmost portion
        if (yellowInner) {
          const barDuration = visEnd - visStart;
          const yellowDuration = Math.min(1, barDuration);
          blueRight = Math.max(blueRight, (yellowDuration / barDuration) * 100);
        }

        // LV overlays
        partialLeaves.forEach(lv => {
          const lvVisStart = Math.max(lv.lvStart, visStart);
          const lvVisEnd   = Math.min(lv.lvEnd, visEnd);
          if (lvVisEnd <= lvVisStart) return;
          const lvL = ((lvVisStart - visStart) / (visEnd - visStart)) * 100;
          const lvW = ((lvVisEnd - lvVisStart) / (visEnd - visStart)) * 100;
          const lvMid = (lv.lvStart + lv.lvEnd) / 2;
          const shiftMid = (visStart + visEnd) / 2;
          if (lvMid <= shiftMid) {
            blueLeft = Math.max(blueLeft, lvL + lvW);  // leave at start
          } else {
            blueRight = Math.max(blueRight, 100 - lvL); // leave at end
          }
        });

        const blueWidth = Math.max(0, 100 - blueLeft - blueRight);

        const wxMark = shouldShowWxOnShift(shift, displayShifts, date)
          ? `<span style="position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:0.85em;font-weight:900;white-space:nowrap;pointer-events:none;z-index:10;"><span style="color:#22c55e;">✓</span> WX</span>`
          : '';

        const barContent = width > 18
          ? `${gapBeforeStr ? `<span style="${gapBeforeStyle}margin-right:6px;font-size:0.85em;">${gapBeforeStr}</span>` : ''}<span style="font-weight:600;margin-right:6px;">${name}</span><span style="font-weight:500;">${label}</span><span style="opacity:0.85;margin-left:5px;font-size:0.85em;font-weight:500;">${durLabel}</span>${gapAfterStr ? `<span style="${gapAfterStyle}margin-left:6px;font-size:0.85em;">${gapAfterStr}</span>` : ''}`
          : width > 10
          ? `<span style="font-weight:600;margin-right:5px;">${name}</span><span style="font-weight:500;">${label}</span>`
          : width > 5
          ? `<span style="font-weight:600;">${name}</span>`
          : '';

        html += `<div class="shift-bar${shift._previewShiftChg ? ' visualize-glow' : ''}"
          style="left:${left}%;width:${width}%;background:${barBg};color:${col.text};overflow:hidden;"
          data-id="${shift.id}" data-name="${name}" data-time="${label}"
          data-dur="${formatDuration(duration)}"
          data-start="${shift.start}" data-end="${shift.end}"
          onmouseenter="showTip(event,this)" onmouseleave="hideTip()"
          onclick="openShiftModal('${shift.id}',event)">
          ${tosOverlays}
          ${yellowInner}
          ${lvOverlays}
          ${wxMark}
          <span class="bar-label" style="
            position:absolute;
            left:${blueLeft}%;
            width:${blueWidth}%;
            top:0;bottom:0;
            z-index:2;
            display:flex;align-items:center;justify-content:center;
            white-space:nowrap;overflow:hidden;
            pointer-events:none;
          ">${barContent}</span>
          <button class="delete-btn" onclick="deleteShift('${shift.id}');event.stopPropagation()">✕</button>
        </div>`;
      });

      html += `</div></div>`;
    });

    html += `</div></div></div>`;
    return html;
  }

  function render() {
    normalizeAllSchedules();
    const container = document.getElementById('timelineContainer');
    const empty = document.getElementById('emptyState');
    const activeDate = getActiveDate();
    const shifts = getActiveShifts();

    if (!shifts.length) {
      container.innerHTML = '';
      container.appendChild(empty);
      document.getElementById('chartSubtitle').textContent = 'No shifts scheduled for this date';
      return;
    }

    // Day = ends at 18:59 or earlier; Eve = ends 19:00–00:00; exclude overnight (start >= 20)
    const dayCount = shifts.filter(s => !s.dev && !s.cic && s.end >= 12 && s.end < 19).length;
    const eveCount = shifts.filter(s => !s.dev && !s.cic && s.end >= 19 && s.end <= 24).length;

    // Determine day of week for threshold rules
    const dow = new Date(activeDate + 'T12:00:00').getDay(); // 0=Sun, 1=Mon...6=Sat
    const isSat = dow === 6;
    const isSun = dow === 0;
    const isWeekend = isSat || isSun;

    // Threshold rules:
    // Mon-Fri day & eve: green>=10, yellow=8-9, red<=7  (wait — re-read: yellow=8, green>=10, red<=7)
    // Sat day & eve:     green>=9,  yellow=7,   red<=6
    // Sun day:           green>=9,  yellow=7,   red<=6  (same as Sat)
    // Sun eve:           green>=10, yellow=8,   red<=7  (same as Mon-Fri)

    function staffColor(count, isWeekendRules) {
      if (isWeekendRules) {
        if (count >= 8)  return '#22a06b'; // green
        return '#d94f6e';                  // red
      } else {
        if (count >= 9) return '#22a06b';  // green
        if (count === 8) return 'var(--text)'; // neutral
        return '#d94f6e';                  // red
      }
    }

    const dayWeekendRules = isSat; // Saturday only
    const eveWeekendRules = isSat;

    const dayColor = staffColor(dayCount, dayWeekendRules);
    const eveColor = staffColor(eveCount, eveWeekendRules);

    const dateLabel = formatDateLabel(activeDate);
    document.getElementById('chartSubtitle').innerHTML =
      `${dateLabel} &nbsp;·&nbsp; <span>Day: <strong style="color:${dayColor};">${dayCount}</strong></span> &nbsp;·&nbsp; <span>Eve: <strong style="color:${eveColor};">${eveCount}</strong></span> &nbsp;·&nbsp; <span style="color:var(--text-muted);font-size:11px;">${BUILD_ID}</span>`;

    let html = `<div class="date-section">`;
    html += renderTimeline(shifts);
    html += `</div>`;
    container.innerHTML = html;
    requestAnimationFrame(fitRows);
  }

  // ── Tooltip (hover) ──
  function showTip(e, el) {
    const tooltip = document.getElementById('tooltip');
    if (!tooltip) return;
    document.getElementById('tt-name').textContent = el.dataset.name;
    document.getElementById('tt-time').textContent = '⏱ ' + el.dataset.time;
    document.getElementById('tt-dur').textContent = '⌚ ' + el.dataset.dur;
    tooltip.classList.add('visible');
    moveTip(e);
  }
  function moveTip(e) {
    const tooltip = document.getElementById('tooltip');
    if (tooltip) {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    }
  }
  function hideTip() {
    const tooltip = document.getElementById('tooltip');
    if (tooltip) tooltip.classList.remove('visible');
  }
  document.addEventListener('mousemove', e => {
    const tooltip = document.getElementById('tooltip');
    if (tooltip && tooltip.classList.contains('visible')) moveTip(e);
  });

  // ── Shift detail modal ──
  let _modalShiftId = null; // track currently open shift

  function toggleAddForm(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const isOpen = el.style.display !== 'none';
    el.style.display = isOpen ? 'none' : 'block';
    if (!isOpen) {
      // Focus the text input and wire Enter key
      const input = el.querySelector('input[type="text"]');
      if (input) {
        setTimeout(() => input.focus(), 50);
        input.onkeydown = function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (id === 'addLeaveForm') confirmAddLeave();
            else if (id === 'addTOSForm') confirmAddTOS();
          }
        };
      }
    }
  }

  function toggleCountForStaffing() {
    const cb = document.getElementById('countForStaffingCb');
    const allShifts = getActiveShifts();
    const shift = allShifts.find(s => String(s.id) === String(_modalShiftId));
    if (!shift) return;
    snapshot(`${cb.checked ? 'Include' : 'Exclude'} ${shift.name} from staffing`);
    shift.countForStaffing = cb.checked;
    render();
    renderRequests();
  }

  function applyModalShiftTime() {
    const shiftId = _modalShiftId;
    const date = getActiveDate();
    const shifts = schedulesByDate[date] || [];
    const shift = shifts.find(s => String(s.id) === String(shiftId));
    if (!shift) return;

    const startRaw = document.getElementById('modalStartTime').value.trim();
    const dur = parseFloat(document.getElementById('modalDuration').value);

    // Parse HHMM start time
    const m = startRaw.match(/^(\d{1,2}):?(\d{2})$/);
    if (!m) { alert('Enter start time as HHMM, e.g. 0700'); return; }
    if (isNaN(dur) || dur <= 0 || dur > 14) { alert('Duration must be between 1 and 14 hours.'); return; }

    snapshot(`Edit shift ${shift.name}`);

    const newStart = parseInt(m[1]) + parseInt(m[2]) / 60;
    const newEnd   = newStart + dur;

    shift.start = newStart;
    shift.end   = newEnd;
    shift.opsStart = newStart;
    shift.opsEnd   = newEnd;
    const repaired = repairShiftTimes(shift);
    Object.assign(shift, repaired);

    refreshRowOrder(date);
    render();
    closeShiftModal();
  }

  function openShiftModal(shiftId, e) {
    if (e) e.stopPropagation();
    hideTip();
    _modalShiftId = String(shiftId);
    _renderShiftModal();
    document.getElementById('shiftModal').style.display = 'flex';
  }

  function _renderShiftModal() {
    const shiftId = _modalShiftId;
    const date = getActiveDate();
    const allShifts = getActiveShifts();
    const shift = allShifts.find(s => String(s.id) === String(shiftId));
    if (!shift) return;
    const name = shift.name;

    // Basic info
    document.getElementById('modalName').textContent = name;
    const startStr = formatTime(shift.start % 24);
    const endStr   = formatTime(shift.end % 24);
    const durStr   = formatDuration(shift.end - shift.start);
    const typeTag  = shift.cic ? ' · CIC' : shift.dev ? ' · Trainee' : '';
    document.getElementById('modalMeta').textContent = `${startStr}–${endStr}  (${durStr})${typeTag}`;

    // Populate shift time edit fields
    const startH = Math.floor(shift.start % 24);
    const startM = Math.round((shift.start % 1) * 60);
    document.getElementById('modalStartTime').value = String(startH).padStart(2,'0') + String(startM).padStart(2,'0');
    document.getElementById('modalDuration').value = shift.end - shift.start;

    // Trainee staffing checkbox
    const staffingEl = document.getElementById('modalStaffingCheck');
    if (shift.dev) {
      staffingEl.style.display = 'flex';
      document.getElementById('countForStaffingCb').checked = !!shift.countForStaffing;
    } else {
      staffingEl.style.display = 'none';
    }

    // Gap info
    const activeDateObj = new Date(date + 'T12:00:00');
    const prevDateObj = new Date(activeDateObj); prevDateObj.setDate(prevDateObj.getDate() - 1);
    const nextDateObj = new Date(activeDateObj); nextDateObj.setDate(nextDateObj.getDate() + 1);
    const prevDateStr = prevDateObj.toISOString().slice(0, 10);
    const nextDateStr = nextDateObj.toISOString().slice(0, 10);
    const allEmpShifts = [];
    [[prevDateStr, -24], [date, 0], [nextDateStr, 24]].forEach(([d, offset]) => {
      (schedulesByDate[d] || []).filter(s => s.name === name).forEach(s => {
        allEmpShifts.push({ ...s, start: s.start + offset, end: s.end + offset });
      });
    });
    allEmpShifts.sort((a, b) => a.start - b.start);
    const thisIdx = allEmpShifts.findIndex(s => String(s.id) === String(shiftId));
    const prevS = thisIdx > 0 ? allEmpShifts[thisIdx - 1] : null;
    const nextS = thisIdx < allEmpShifts.length - 1 ? allEmpShifts[thisIdx + 1] : null;
    const gapBefore = prevS ? shift.start - prevS.end : null;
    const gapAfter  = nextS ? nextS.start - shift.end : null;
    const gapsEl = document.getElementById('modalGaps');
    const gapContent = document.getElementById('modalGapContent');
    if (gapBefore !== null && gapBefore > 0 || gapAfter !== null && gapAfter > 0) {
      gapContent.innerHTML = '';
      if (gapBefore !== null && gapBefore > 0) {
        const red = gapBefore < 10;
        gapContent.innerHTML += `<div style="color:${red?'#d94f6e':'var(--text)'};font-weight:${red?'700':'400'};">◀ ${formatDuration(gapBefore)} since previous shift${red?' ⚠':''}</div>`;
      }
      if (gapAfter !== null && gapAfter > 0) {
        const red = gapAfter < 10;
        gapContent.innerHTML += `<div style="color:${red?'#d94f6e':'var(--text)'};font-weight:${red?'700':'400'};">${formatDuration(gapAfter)} until next shift ▶${red?' ⚠':''}</div>`;
      }
      gapsEl.style.display = 'block';
    } else {
      gapsEl.style.display = 'none';
    }

    // Leave items — show all with leave times (pasted or manually added, active or removed)
    const allReqs = requestsByDate[date] || [];
    const leaveItems = allReqs.filter(r =>
      r.cpc === name && (
        (r.lvStart != null && r.lvEnd != null) ||    // active leave
        (r._lvStartOrig != null && r._lvEndOrig != null) // removed leave (still has orig)
      )
    );
    const leaveList = document.getElementById('modalLeaveList');
    leaveList.innerHTML = leaveItems.map(lv => {
      const isRemoved = lv._leaveRemoved === true;
      const lvS = isRemoved ? lv._lvStartOrig : (lv.lvStart ?? lv._lvStartOrig);
      const lvE = isRemoved ? lv._lvEndOrig   : (lv.lvEnd   ?? lv._lvEndOrig);
      const typeLabel = LEAVE_TYPES[lv.type] || lv.type || 'Leave';
      return `<div class="modal-item${isRemoved ? ' removed' : ''}">
        <span class="modal-item-label">LV ${formatTime(lvS)}–${formatTime(lvE)} · ${typeLabel}</span>
        ${isRemoved
          ? `<button class="modal-item-remove" style="background:rgba(26,171,155,0.1);color:var(--accent3);border-color:rgba(26,171,155,0.3);" onclick="readLeaveFromModal('${lv.id}')">Re-add</button>`
          : `<button class="modal-item-remove" onclick="removeLeaveFromModal('${lv.id}')">Remove</button>`
        }
      </div>`;
    }).join('');

    // TOS items — stored directly on the shift, not in requests
    const tosItems = shift.tosList || [];
    const tosList = document.getElementById('modalTOSList');
    tosList.innerHTML = tosItems.map(tos => {
      const label = `TOS${tos.type ? ' ' + tos.type : ''} ${formatTime(tos.tosStart ?? 0)}–${formatTime(tos.tosEnd ?? 0)}`;
      return `<div class="modal-item${tos.removed ? ' removed' : ''}">
        <span class="modal-item-label">${label}</span>
        ${tos.removed
          ? `<button class="modal-item-remove" style="background:rgba(26,171,155,0.1);color:var(--accent3);border-color:rgba(26,171,155,0.3);" onclick="readdTOSFromModal('${tos.id}')">Re-add</button>`
          : `<button class="modal-item-remove" onclick="removeTOSFromModal('${tos.id}')">Remove</button>`
        }
      </div>`;
    }).join('');

    // Reset add forms
    ['addLeaveForm','addTOSForm'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
  }

  function closeShiftModal(e) {
    if (e && e.target !== document.getElementById('shiftModal')) return;
    document.getElementById('shiftModal').style.display = 'none';
    _modalShiftId = null;
  }

  function removeLeaveFromModal(leaveId) {
    const date = getActiveDate();
    const reqs = requestsByDate[date] || [];
    const req = reqs.find(r => String(r.id) === String(leaveId));
    if (req) {
      snapshot(`Remove leave – ${req.cpc}`);
      // Preserve originals before nulling (handles both pasted and manually-added leave)
      req._lvStartOrig = req._lvStartOrig ?? req.lvStart;
      req._lvEndOrig   = req._lvEndOrig   ?? req.lvEnd;
      req._leaveRemoved = true;
      req.lvStart = null;
      req.lvEnd   = null;
      req.resolvedAction = 'deny';
    }
    render();
    renderRequests();
    _renderShiftModal();
  }

  function readLeaveFromModal(leaveId) {
    const date = getActiveDate();
    const reqs = requestsByDate[date] || [];
    const req = reqs.find(r => String(r.id) === String(leaveId));
    if (req) {
      snapshot(`Re-add leave – ${req.cpc}`);
      req.lvStart = req._lvStartOrig;
      req.lvEnd   = req._lvEndOrig;
      req._leaveRemoved = false;
      req.resolvedAction = 'approve';
      req.status = 'approved-partial';
    }
    render();
    renderRequests();
    _renderShiftModal();
  }

  function removeTOSFromModal(tosId) {
    const shift = _getModalShift();
    if (!shift || !shift.tosList) return;
    const tos = shift.tosList.find(t => String(t.id) === String(tosId));
    if (tos) {
      snapshot(`Remove TOS – ${shift.name}`);
      tos.removed = true;
    }
    refreshRowOrder(getActiveDate());
    render();
    _renderShiftModal();
  }

  function readdTOSFromModal(tosId) {
    const shift = _getModalShift();
    if (!shift || !shift.tosList) return;
    const tos = shift.tosList.find(t => String(t.id) === String(tosId));
    if (tos) {
      snapshot(`Re-add TOS – ${shift.name}`);
      tos.removed = false;
    }
    refreshRowOrder(getActiveDate());
    render();
    _renderShiftModal();
  }

  function _getModalShift() {
    const allShifts = getActiveShifts();
    return allShifts.find(s => String(s.id) === String(_modalShiftId)) || null;
  }

  function parseTimeRange(str) {
    // Accepts "HHMM-HHMM" or "HH:MM-HH:MM" or "HHMM–HHMM"
    if (!str) return null;
    const parts = str.trim().split(/[-–]/);
    if (parts.length !== 2) return null;
    const start = parseTimeStr(parts[0].replace(/:/g, ''));
    const end   = parseTimeStr(parts[1].replace(/:/g, ''));
    if (start === null || end === null) return null;
    return { start, end };
  }

  function confirmAddLeave() {
    const date = getActiveDate();
    const shiftId = _modalShiftId;
    const allShifts = getActiveShifts();
    const shift = allShifts.find(s => String(s.id) === String(shiftId));
    if (!shift) return;

    const rangeVal = document.getElementById('addLeaveRange').value.trim();
    const type     = document.getElementById('addLeaveType').value;
    const range = parseTimeRange(rangeVal);
    if (!range) { alert('Enter time range as HHMM-HHMM, e.g. 1200-1300'); return; }
    const { start: lvStart, end: lvEnd } = range;
    if (lvEnd <= lvStart) { alert('End must be after start.'); return; }

    snapshot(`Add leave – ${shift.name}`);

    if (!requestsByDate[date]) requestsByDate[date] = [];
    requestsByDate[date].push({
      id: Date.now() + Math.random(),
      cpc: shift.name,
      type,
      from: rangeVal.split(/[-–]/)[0].trim(),
      to:   rangeVal.split(/[-–]/)[1].trim(),
      status: 'approved-partial',
      isLeave: true,
      isPartial: true,
      resolvedAction: 'approve',
      lvStart, lvEnd,
      _lvStartOrig: lvStart,
      _lvEndOrig: lvEnd,
      _leaveRemoved: false
    });

    render();
    renderRequests();
    closeShiftModal();
  }

  function confirmAddTOS() {
    const shiftId = _modalShiftId;
    const allShifts = getActiveShifts();
    const shift = allShifts.find(s => String(s.id) === String(shiftId));
    if (!shift) return;

    const rangeVal = document.getElementById('addTOSRange').value.trim();
    const range = parseTimeRange(rangeVal);
    if (!range) { alert('Enter time range as HHMM-HHMM, e.g. 0700-0800'); return; }
    const { start: tosStart, end: tosEnd } = range;
    if (tosEnd <= tosStart) { alert('End must be after start.'); return; }

    snapshot(`Add TOS – ${shift.name}`);

    if (!shift.tosList) shift.tosList = [];
    shift.tosList.push({
      id: Date.now() + Math.random(),
      from: rangeVal.split(/[-–]/)[0].trim(),
      to:   rangeVal.split(/[-–]/)[1].trim(),
      tosStart, tosEnd,
      removed: false
    });

    refreshRowOrder(getActiveDate());
    render();
    closeShiftModal();
  }

  // ── Persistence ──
  const STORAGE_KEY = 'shiftGraph_v1';

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        schedulesByDate,
        requestsByDate,
        rowOrderByDate,
        importRawByDate
      }));
    } catch(e) { console.warn('Save failed:', e); }
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.schedulesByDate) {
        Object.entries(data.schedulesByDate).forEach(([date, shifts]) => {
          schedulesByDate[date] = shifts.map(repairShiftTimes);
        });
      }
      normalizeAllSchedules();
      if (data.requestsByDate)  Object.assign(requestsByDate,  data.requestsByDate);
      sanitizeRequests();
      if (data.rowOrderByDate)  Object.assign(rowOrderByDate,  data.rowOrderByDate);
      if (data.importRawByDate) Object.assign(importRawByDate, data.importRawByDate);
      rebuildRequestsFromImportRaw();
    } catch(e) { console.warn('Load failed:', e); }
  }

  // Patch render to auto-save on every call
  const _origRender = render;
  render = function() {
    _origRender();
    saveData();
    // Re-apply glow to all previewed bars (DOM was rebuilt)
    const activeDate = getActiveDate();
    previewReqIds.forEach(pid => {
      const r = (requestsByDate[activeDate] || []).find(x => String(x.id) === pid);
      if (!r) return;
      document.querySelectorAll(`.shift-bar[data-name="${r.cpc}"]`)
        .forEach(bar => bar.classList.add('visualize-glow'));
    });
  };

  // Also save when renderRequests is called (request state changes)
  const _origRenderRequests = renderRequests;
  renderRequests = function() { _origRenderRequests(); saveData(); };

  // Safety net: save on page close/refresh
  window.addEventListener('beforeunload', saveData);

  // Expose for browser extension injection
  window.importFromText = importFromText;
  window.importPayPeriodHTML = importPayPeriodHTML;
  (function init() {
    loadData();
    console.info('Shift Graph build:', BUILD_ID);
    updateUndoRedoBtns();

    const today = localDateStr();
    const dateFilter = document.getElementById('dateFilter');
    if (dateFilter) {
      // If we have saved data, open to the most recent date; otherwise today
      const savedDates = Object.keys(schedulesByDate).sort();
      const startDate = savedDates.length ? savedDates[savedDates.length - 1] : today;
      dateFilter.value = startDate;
      dateFilter.addEventListener('change', () => { render(); renderRequests(); });
    }
    render();
    renderRequests();

    document.addEventListener('keydown', e => {
      if (e.target.matches('input, textarea, select')) return;
      const mod = e.ctrlKey || e.metaKey;
      if (!mod) return;
      if (e.key === 'z' && !e.shiftKey) {
        e.preventDefault();
        undoAction();
      } else if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) {
        e.preventDefault();
        redoAction();
      }
    });

    const ro = new ResizeObserver(() => fitRows());
    const cb = document.querySelector('.chart-body');
    if (cb) ro.observe(cb);

    // Check for data sent from the browser extension
    function checkExtensionData() {
      // Direct injection fallback
      if (window._sgPendingImport) {
        const data = window._sgPendingImport;
        window._sgPendingImport = null;
        importFromText(data);
        return;
      }
      // chrome.storage fallback (works when Shift Graph is served, not file://)
      if (typeof chrome !== 'undefined' && chrome.storage) {
        try {
          chrome.storage.local.get('pendingImport', result => {
            if (result && result.pendingImport && result.pendingImport.data) {
              chrome.storage.local.remove('pendingImport');
              importFromText(result.pendingImport.data);
            }
          });
        } catch(e) {}
      }
    }
    checkExtensionData();
    window.addEventListener('focus', checkExtensionData);
    // Also poll every 2s in case focus event missed
    setInterval(checkExtensionData, 2000);

    // Listen for data from browser extension (custom event fallback)
    window.addEventListener('sgImport', e => {
      if (e.detail) importFromText(e.detail);
    });

    setInterval(() => { if (getActiveDate() === localDateStr()) render(); }, 60000);
  })();
</script>
